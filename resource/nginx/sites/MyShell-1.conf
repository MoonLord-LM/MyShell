map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

server {
    listen 80 reuseport so_keepalive=15:15:3 default_server;
    listen [::]:80 reuseport so_keepalive=15:15:3 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl reuseport so_keepalive=15:15:3 default_server;
    listen [::]:443 ssl reuseport so_keepalive=15:15:3 default_server;

    ssl_certificate_key "/etc/nginx/ssl/server-key.pem";
    ssl_certificate "/etc/nginx/ssl/server-cert.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip off;

    server_name _;

    root /var/www/html;

    index index.php index.html;

    error_page 404 =404 @not_found;

    location @not_found {
        try_files /404.php /404.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location ~ \.php$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS,HEAD,PUT,DELETE" always;
        add_header Access-Control-Allow-Headers "Content-Type,X-Requested-With" always;
        add_header X-Content-Type-Options nosniff always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location /ws/def37991-0eb8-4652-acdd-1e7db5c9d2ce {
        proxy_pass http://127.0.0.1:10010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
    }
}

upstream backend_frp {
    server 127.0.0.1:17500;
    keepalive 100;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate_key "/etc/nginx/ssl/server-key.pem";
    ssl_certificate "/etc/nginx/ssl/server-cert.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip off;

    server_name ~^[^.]*frp[^.]*\.[^.]+\.[^.]+;

    location / {
        proxy_pass https://backend_frp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_ssl_name $host;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse on;
        proxy_ssl_verify off;
    }
}

