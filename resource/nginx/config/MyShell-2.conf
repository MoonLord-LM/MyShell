map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate_key "/etc/nginx/ssl/server-key.pem";
    ssl_certificate "/etc/nginx/ssl/server-cert.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip off;

    server_name _;

    root /var/www/html;

    index index.php index.html;

    error_page 404 =404 @not_found;

    location @not_found {
        try_files /404.php /404.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /nginx_status {
        allow 127.0.0.1;
        allow 172.17.0.1;
        deny all;
    }

    location ~ \.php$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS,HEAD,PUT,DELETE" always;
        add_header Access-Control-Allow-Headers "Content-Type,X-Requested-With" always;
        add_header X-Content-Type-Options nosniff always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location /ws/2c731eb2-1e86-4092-a4df-122833917c2c {
        proxy_pass http://127.0.0.1:10010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate_key "/etc/nginx/ssl/server-key.pem";
    ssl_certificate "/etc/nginx/ssl/server-cert.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip off;

    server_name ~^[^.]*frp[^.]*\.[^.]+\.[^.]+;

    location / {
        proxy_pass https://127.0.0.1:17500;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        proxy_ssl_verify off;
        proxy_redirect off;
    }
}

